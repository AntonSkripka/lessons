<body>
    <style>
        h3 {
            font-size: 1em;
        }

        .list,
        .menu,
        .menu2,
        .image,
        .button-box,
        .box {
            width: 45%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            background-color: #dfffdf;
        }

        .box {
            text-align: center;
        }

        .box button {
            color: #ad00e2;
            background-color: #fffac4;
        }

        button.accent {
            color: green;
        }

        #parent-1,
        #parent-2,
        #child-1,
        #child-2,
        #descendant-1,
        #descendant-2 {
            margin: 16px;
            padding: 16px;
            border: 4px solid #212121;
            border-radius: 8px;
            color: #fff;
            font-weight: 500;
            font-size: 20px;
            text-transform: uppercase;
        }

        #parent-1,
        #parent-2 {
            background-color: #673ab7;
        }

        #child-1,
        #child-2 {
            background-color: #448aff;
        }

        #descendant-1,
        #descendant-2 {
            background-color: #ff9800;
        }

        #buttons-box {
            margin: 16px;
            padding: 20px;
            display: grid;
            gap: 20px;
            justify-content: center;
            color: tomato;
            outline: 1px solid tomato;
        }

        #buttons-box.active {
            background-color: lightcyan;
        }

        .buttons-box-button {
            /* width: 75%; */
            padding: 10px 20px;
        }

        /* .buttons-box-button:nth-child(1) {
    background-color: lightgreen;
} */

        .buttons-box-button.active {
            background-color: lightgreen;
        }

        /*? Палітра кольорів */
        .output {
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            font-size: 24px;
            font-weight: 700;
            text-shadow: 2px 2px 3px #636363;
        }

        .color-palette {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(40px, 1fr));
            gap: 4px;
        }

        .color-palette .item {
            padding: 0;
            margin: 0;
            border: none;
            border-radius: 4px;
            width: 40px;
            height: 40px;
            /* cursor: pointer; */
            cursor: zoom-in;
            transition: transform 250ms ease-in-out;
        }

        .color-palette .item:hover {
            transform: scale(1.1);
        }
    </style>
