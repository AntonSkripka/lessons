<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW-70</title>
</head>

<body>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
        }

        .gallery {
            display: flex;
            flex-direction: column;
            gap: 40px;
            max-width: 800px;
            margin: 0 auto;
        }

        .image-container {
            position: relative;
            width: 100%;
            min-height: 450px;
            background-color: #f0f0f0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        img.lazy-image {
            width: 100%;
            height: 450px;
            object-fit: cover;
            display: block;
            opacity: 0;
            filter: blur(10px);
            transition: opacity 0.6s ease-in-out, filter 0.6s ease-in-out;
        }

        img.lazy-image.loaded {
            opacity: 1;
            filter: blur(0);
        }

        .spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 4px solid #ccc;
            border-top-color: #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            pointer-events: none;
        }

        .image-container:has(img.loaded) .spinner {
            display: none;
        }

        @keyframes spin {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .manual-load {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .load-btn {
            position: absolute;
            bottom: 20px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: background 0.2s;
        }

        .load-btn:hover {
            background-color: #2980b9;
        }

        .image-container:has(img.loaded) .load-btn {
            display: none;
        }
    </style>
    <h1>HW-70</h1>
    <a href="./lesson-13.html">Previous</a>
    <a href="./lesson-14.html">Next</a>
    <header>
        <h1>Галерея з Lazy Loading та IntersectionObserver</h1>
        <p>Прокрутіть вниз, щоб побачити завантаження, або натисніть кнопку під фото.</p>
    </header>

    <main class="gallery">
        <div class="image-container">
            <img src="https://via.placeholder.com/800x450/f0f0f0/cccccc?text=Loading..."
                data-src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&format=webp&q=80&w=1200"
                data-srcset="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&format=webp&q=80&w=600 600w,
                             https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&format=webp&q=80&w=1200 1200w"
                sizes="(max-width: 600px) 100vw, 1200px" alt="Красивий краєвид 1" class="lazy-image">
            <div class="spinner"></div>
        </div>

        <div class="image-container">
            <img src="https://via.placeholder.com/800x450/f0f0f0/cccccc?text=Loading..."
                data-src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&format=webp&q=80&w=1200"
                data-srcset="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&format=webp&q=80&w=600 600w,
                             https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&format=webp&q=80&w=1200 1200w"
                sizes="(max-width: 600px) 100vw, 1200px" alt="Красивий краєвид 2" class="lazy-image">
            <div class="spinner"></div>
        </div>

        <div class="image-container manual-load">
            <img src="https://via.placeholder.com/800x450/f0f0f0/cccccc?text=Click+to+Load"
                data-src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&format=webp&q=80&w=1200"
                alt="Красивий краєвид 3" class="lazy-image click-to-load">
            <div class="spinner"></div>
            <button class="load-btn">Завантажити зображення</button>
        </div>
    </main>

    <script src="./js/hw-70.js"></script>
</body>

</html>
